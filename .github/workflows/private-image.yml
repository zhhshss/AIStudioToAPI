name: Build Private Image

on:
  workflow_dispatch:
    inputs:
      image_repository:
        description: "GHCR repository name (without owner)"
        required: true
        default: "private-gateway"
        type: string
      image_tag:
        description: "Image tag"
        required: true
        default: "latest"
        type: string
      hf_container_name:
        description: "Optional neutral name stored as the image label for a Hugging Face deployment"
        required: true
        default: "private-gateway"
        type: string
      singbox_version:
        description: "Pinned Sing-box release"
        required: true
        default: "1.13.19"
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/${{ inputs.image_repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push on GitHub runner
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.image_tag }}
          build-args: |
            VERSION=${{ inputs.image_tag }}
            HF_CONTAINER_NAME=${{ inputs.hf_container_name }}
            SINGBOX_VERSION=${{ inputs.singbox_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Print Hugging Face deployment placeholders
        run: |
          echo "HF_SPACE_ID is intentionally supplied by the deployment project, not committed here."
          echo "Use image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.image_tag }}"
          echo "Image label/container-name placeholder: ${{ inputs.hf_container_name }}"
